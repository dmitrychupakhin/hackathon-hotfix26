server {

    listen 80;
    listen [::]:80;
    
    http2 on;

    server_name 127.0.0.1;
    
    client_max_body_size 40M;
    charset utf-8;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /static/;
    }

    location ^~ /media/chats/ {
        return 404;
    }

    location ^~ /media/comparisons/ {
        return 404;
    }

    location /media/ {
        alias /media/;
    }

    location /admin/ {
        proxy_pass http://django:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /ai/docs {
        proxy_pass http://ai:8000/docs;
        proxy_set_header Host $host;
    }

    location = /ai/openapi.json {
        proxy_pass http://ai:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location ~ ^/ai/api/v1/runs/[^/]+/ws$ {
        rewrite ^/ai(/.*)$ $1 break;
        proxy_pass http://ai:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 700s;
    }

    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
