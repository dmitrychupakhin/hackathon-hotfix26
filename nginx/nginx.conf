server {
    listen 443 ssl;
    listen [::]:443 ssl;
    
    http2 on;

    server_name company-corp.ru;

    client_max_body_size 40M;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/company-corp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/company-corp.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/company-corp.ru/chain.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /static/;
    }

    location ^~ /media/chats/ {
        return 404;
    }

    location ^~ /media/comparisons/ {
        return 404;
    }

    location /media/ {
        alias /media/;
    }

    location /admin/ {
        proxy_pass http://django:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Requested-With $http_x_requested_with;
        proxy_set_header X-Client-Platform $http_x_client_platform;
        proxy_redirect off;
    }

    location = /ai/docs {
        proxy_pass http://ai:8000/docs;
        proxy_set_header Host $host;
    }

    location = /ai/openapi.json {
        proxy_pass http://ai:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location ~ ^/ai/api/v1/runs/[^/]+/ws$ {
        rewrite ^/ai(/.*)$ $1 break;
        proxy_pass http://ai:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 700s;
    }

    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name company-corp.ru;

    return 301 https://company-corp.ru$request_uri;

    location / {
        return 301 https://company-corp.ru$request_uri;
    }
}
