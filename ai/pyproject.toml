[project]
name = "onsoft-ai"
version = "0.1.0"
description = "Evidence-checked procurement assistant and reproducible evaluations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "pypdf>=5,<7",
  "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["app/services/official_checker.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
