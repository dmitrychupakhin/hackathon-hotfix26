name: onsoft-ai
services:
  ai:
    build: .
    ports:
      - "${AI_BIND_HOST:-127.0.0.1}:${AI_PORT:-8010}:8000"
    environment:
      APIMIRA_API_KEY: ${APIMIRA_API_KEY:-}
      APIMIRA_BASE_URL: ${APIMIRA_BASE_URL:-https://apimira.com/v1}
      APIMIRA_MODEL: ${APIMIRA_MODEL:-openai/gpt-6-luna}
      AI_LLM_TIMEOUT_SECONDS: ${AI_LLM_TIMEOUT_SECONDS:-180}
      AI_LLM_MAX_OUTPUT_TOKENS: ${AI_LLM_MAX_OUTPUT_TOKENS:-8000}
      AI_ENV: ${AI_ENV:-development}
      AI_DATABASE_URL: ${AI_DATABASE_URL:-}
      AI_SOURCE_ROOT: /source
      AI_FILE_CACHE_ROOT: /data/files
      AI_FILE_IMPORT_TIMEOUT_SECONDS: ${AI_FILE_IMPORT_TIMEOUT_SECONDS:-300}
      AI_OCR_ENABLED: ${AI_OCR_ENABLED:-false}
      AI_CHUNK_TARGET_TOKENS: ${AI_CHUNK_TARGET_TOKENS:-2000}
      AI_CHUNK_OVERLAP_TOKENS: ${AI_CHUNK_OVERLAP_TOKENS:-200}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      AI_ALLOWED_BASE_URLS: ${AI_ALLOWED_BASE_URLS:-}
      AI_CONTEXT_WINDOW_TOKENS: ${AI_CONTEXT_WINDOW_TOKENS:-266000}
      AI_MAX_CONTEXT_REDUCTIONS: ${AI_MAX_CONTEXT_REDUCTIONS:-5}
      AI_MAX_CONCURRENT_RUNS: ${AI_MAX_CONCURRENT_RUNS:-2}
      AI_MAX_PENDING_RUNS: ${AI_MAX_PENDING_RUNS:-100}
      AI_RUN_TIMEOUT_SECONDS: ${AI_RUN_TIMEOUT_SECONDS:-1200}
      AI_MAX_MODEL_CALLS: ${AI_MAX_MODEL_CALLS:-48}
      AI_MAX_UPLOAD_BYTES: ${AI_MAX_UPLOAD_BYTES:-10485760}
      AI_MAX_PACKAGE_BYTES: ${AI_MAX_PACKAGE_BYTES:-33554432}
      AI_INPUT_PRICE_PER_MILLION: ${AI_INPUT_PRICE_PER_MILLION:-}
      AI_OUTPUT_PRICE_PER_MILLION: ${AI_OUTPUT_PRICE_PER_MILLION:-}
      AI_CACHED_PRICE_PER_MILLION: ${AI_CACHED_PRICE_PER_MILLION:-}
      AI_PRICE_CURRENCY: ${AI_PRICE_CURRENCY:-RUB}
      AI_ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ai-data:/data
      - ${AI_SOURCE_DIR:-./incoming}:/source:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  ai-data:
